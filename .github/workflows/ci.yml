name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  backend:
    name: Backend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build backend
        working-directory: PortfolioBackend
        run: mvn clean package -DskipTests


  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PortfolioFrontend/package-lock.json

      - name: Install dependencies
        working-directory: PortfolioFrontend
        run: npm ci

      - name: Build frontend
        working-directory: PortfolioFrontend
        run: npm run build

  docker:
    name: Docker - Build & Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./PortfolioBackend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/portfolio-backend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/portfolio-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./PortfolioFrontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/portfolio-frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/portfolio-frontend:${{ github.sha }}