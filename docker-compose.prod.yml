services:
  postgres:
    image: postgres:18
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/neoblishange/portfolio-backend:latest
    container_name: portfolio-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      APP_JWT_ISSUER: ${APP_JWT_ISSUER}
      APP_JWT_PRIVATE_KEY_PATH: ${APP_JWT_PRIVATE_KEY_PATH}
      APP_JWT_PUBLIC_KEY_PATH: ${APP_JWT_PUBLIC_KEY_PATH}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keys:/app/keys:ro
      - ./data:/app/data:ro

  frontend:
    image: ghcr.io/neoblishange/portfolio-frontend:latest
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend

volumes:
  postgres_data: