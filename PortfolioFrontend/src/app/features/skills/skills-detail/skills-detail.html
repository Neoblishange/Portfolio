<div class="skills-detail">
  @if (skillResource.isLoading()) {
    <p>Loading...</p>
  }

  @if (skillResource.error()) {
    <p class="error">Unable to load this skill.</p>
  }

  @if (skillResource.value(); as skill) {
    <a routerLink="/skills">← Back to skills list</a>

    <h1>{{ skill.name }}</h1>
    <p class="category">Category: {{ skill.category.name }}</p>
    @if (skill.level) {
      <p class="level">Level: {{ skill.level }}</p>
    }

    <a [routerLink]="['/skills', skill.id, 'edit']">Edit</a>
  }
</div>
