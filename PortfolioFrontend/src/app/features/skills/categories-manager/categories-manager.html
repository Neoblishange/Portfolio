<div class="categories-manager">
  <h1>Categories</h1>

  <form (submit)="$event.preventDefault(); onAdd()">
    <input
      type="text"
      placeholder="Category name"
      [value]="newCategoryName()"
      (input)="newCategoryName.set($any($event.target).value)"
    />
    <button type="submit">Add</button>
  </form>

  @if (categoriesResource.isLoading()) {
    <p>Loading...</p>
  }

  @if (categoriesResource.error()) {
    <p class="error">An error occurred while loading categories.</p>
  }

  @if (categoriesResource.value(); as categories) {
    <ul>
      @for (category of categories; track category.id) {
        <li>
          {{ category.name }}
          <button (click)="onDelete(category.id)">Delete</button>
        </li>
      }
    </ul>
  }
</div>
